name: feature request
description: suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: what would you like to see?
      description: describe the problem first, then the change you have in mind.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: scope check
      options:
        - label: it only involves freely accessible, public content (no DRM, no private or paid content)
          required: true
